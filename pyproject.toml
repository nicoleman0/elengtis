[project]
name = "elengtis"
version = "0.1.0"
description = "Synthetic MCP agent-loop benchmark baseline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ncoleman" }]
keywords = ["mcp", "prompt-injection", "benchmark", "agent-security", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "langchain-openrouter>=0.1,<1",
    "langgraph>=1,<2",
    "mcp>=1.26,<2",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/nicoleman0/elengtis"
Issues = "https://github.com/nicoleman0/elengtis/issues"

[project.scripts]
elengtis = "elengtis.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "elengtis"

[tool.pylint.messages_control]
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring"]
