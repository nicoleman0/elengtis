services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elengtis
      POSTGRES_USER: elengtis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U elengtis"], interval: 5s, timeout: 3s, retries: 20}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20}

  bucket-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$ELENGTIS_S3_BUCKET"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ELENGTIS_S3_BUCKET: ${ELENGTIS_S3_BUCKET:-elengtis}

  migrate:
    build: {context: ., target: web}
    command: ["elengtis", "db", "migrate"]
    depends_on: {postgres: {condition: service_healthy}, bucket-init: {condition: service_completed_successfully}}
    environment: &application_environment
      ELENGTIS_DATABASE_URL: postgresql://elengtis:${POSTGRES_PASSWORD}@postgres/elengtis
      ELENGTIS_S3_ENDPOINT: http://minio:9000
      ELENGTIS_S3_BUCKET: ${ELENGTIS_S3_BUCKET:-elengtis}
      ELENGTIS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      ELENGTIS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ELENGTIS_PUBLIC_URL: ${ELENGTIS_PUBLIC_URL:?set public HTTPS URL}
      ELENGTIS_OIDC_ISSUER: ${ELENGTIS_OIDC_ISSUER:?set OIDC issuer}
      ELENGTIS_OIDC_CLIENT_ID: ${ELENGTIS_OIDC_CLIENT_ID:?set OIDC client ID}
      ELENGTIS_OIDC_CLIENT_SECRET: ${ELENGTIS_OIDC_CLIENT_SECRET:?set OIDC client secret}
      ELENGTIS_SESSION_SECRET: ${ELENGTIS_SESSION_SECRET:?set session secret}
      ELENGTIS_TRUSTED_PROXY_IPS: ${ELENGTIS_TRUSTED_PROXY_IPS:?set trusted proxy IPs}

  web:
    build: {context: ., target: web}
    ports: ["${ELENGTIS_BIND:-127.0.0.1}:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment: *application_environment
    restart: unless-stopped

  runner:
    build: {context: ., target: runner}
    network_mode: host
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      <<: *application_environment
      ELENGTIS_DATABASE_URL: ${ELENGTIS_RUNNER_DATABASE_URL:-postgresql://elengtis:${POSTGRES_PASSWORD}@127.0.0.1/elengtis}
      ELENGTIS_S3_ENDPOINT: ${ELENGTIS_RUNNER_S3_ENDPOINT:-http://127.0.0.1:9000}
      ELENGTIS_ALLOWED_EXECUTION_SECRETS: ${ELENGTIS_ALLOWED_EXECUTION_SECRETS:-OPENROUTER_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    group_add: ["${DOCKER_GID:?set Docker socket group ID}"]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
