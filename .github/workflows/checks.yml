name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Ubuntu only: the fixture is a stdio subprocess with no platform-specific code.
  # Add an OS matrix if a platform bug actually appears.
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact tags: setup-uv publishes no moving major alias above v7,
      # and exact pins keep CI reproducible alongside the locked environment.
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Deterministic checks — no secrets, no live model calls
        run: |
          uv run python -m unittest discover -s tests -v
          uv run elengtis validate src/elengtis/examples/offline.yaml

      - name: Build the package
        run: uv build

      - name: Run the documented example from the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            elengtis example --out "$RUNNER_TEMP/example"
          grep -q 'completed: 1/1' "$RUNNER_TEMP/example/summary.txt"

  isolated-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Build the package for the target image
        run: uv build
      - name: Exercise the isolated MCP target contract
        run: timeout --signal=TERM --kill-after=30s 5m uv run python tests/docker_target_smoke.py

      - name: Exercise the DBHub injection verifier
        run: |
          docker build --pull=false -t elengtis/dbhub:1.2.3 experiments/real-targets/dbhub
          timeout --signal=TERM --kill-after=30s 5m uv run python tests/docker_dbhub_smoke.py
